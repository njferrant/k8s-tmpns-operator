# This rule is not used by the project k8s-tmpns-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the tmpns.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: k8s-tmpns-operator
    app.kubernetes.io/managed-by: kustomize
  name: tempnamespace-editor-role
rules:
- apiGroups:
  - tmpns.io
  resources:
  - tempnamespaces
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - tmpns.io
  resources:
  - tempnamespaces/status
  verbs:
  - get
